<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Filter benign Vite HMR websocket connection notices in sandboxed dev container
      (function() {
        const _origError = console.error;
        const _origWarn = console.warn;
        console.error = function(...args) {
          const msg = args.map(a => (a !== undefined && a !== null ? String(a) : '')).join(' ');
          if (msg.includes('[vite]') && !msg.toLowerCase().includes('syntax')) {
            console.debug(...args);
            return;
          }
          _origError.apply(console, args);
        };
        console.warn = function(...args) {
          const msg = args.map(a => (a !== undefined && a !== null ? String(a) : '')).join(' ');
          if (msg.includes('[vite]')) {
            console.debug(...args);
            return;
          }
          _origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && e.message.includes('[vite]') && !e.message.toLowerCase().includes('syntax')) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
