<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Mock vite-hmr WebSocket in dev container to prevent unhandled connection rejections
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            const RealWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              const isViteHmr = (typeof protocols === 'string' && protocols === 'vite-hmr') ||
                                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                                (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')));
              if (isViteHmr) {
                const listeners = {};
                const mockWs = {
                  readyState: 1, // OPEN
                  OPEN: 1,
                  CONNECTING: 0,
                  CLOSING: 2,
                  CLOSED: 3,
                  url: String(url),
                  protocol: 'vite-hmr',
                  bufferedAmount: 0,
                  extensions: '',
                  binaryType: 'blob',
                  send: function() {},
                  close: function() {
                    mockWs.readyState = 3;
                    if (listeners['close']) {
                      listeners['close'].forEach(cb => { try { cb({ wasClean: true, code: 1000, reason: '' }); } catch (_) {} });
                    }
                  },
                  addEventListener: function(type, cb) {
                    if (!listeners[type]) listeners[type] = [];
                    listeners[type].push(cb);
                    if (type === 'open') {
                      setTimeout(() => { try { cb({ type: 'open' }); } catch (_) {} }, 0);
                    }
                  },
                  removeEventListener: function(type, cb) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(fn => fn !== cb);
                    }
                  },
                  dispatchEvent: function() { return true; }
                };
                return mockWs;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.OPEN = RealWebSocket.OPEN;
            window.WebSocket.CONNECTING = RealWebSocket.CONNECTING;
            window.WebSocket.CLOSING = RealWebSocket.CLOSING;
            window.WebSocket.CLOSED = RealWebSocket.CLOSED;
          }
        } catch (_) {}

        // Filter benign Vite HMR websocket connection notices in sandboxed dev container
        const isViteNoise = function(args) {
          try {
            const msg = args.map(a => {
              if (!a) return '';
              if (typeof a === 'string') return a;
              return (a.message || a.stack || a.reason || String(a));
            }).join(' ');
            return msg.includes('[vite]') || msg.includes('vite-hmr') || msg.includes('WebSocket closed without opened');
          } catch {
            return false;
          }
        };

        const _origError = console.error;
        console.error = function(...args) {
          if (isViteNoise(args)) return;
          _origError.apply(console, args);
        };

        const _origWarn = console.warn;
        console.warn = function(...args) {
          if (isViteNoise(args)) return;
          _origWarn.apply(console, args);
        };

        const _origDebug = console.debug;
        console.debug = function(...args) {
          if (isViteNoise(args)) return;
          _origDebug.apply(console, args);
        };

        const _origInfo = console.info;
        console.info = function(...args) {
          if (isViteNoise(args)) return;
          _origInfo.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (e && isViteNoise([e.message, e.filename, e.error])) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && isViteNoise([e.reason, e.reason?.message])) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
